{% extends "base.html" %}

{% block extrahead %}
{{ super() }}
<meta name="google-site-verification" content="p2PAkAxLHbWKKlpC9J6HE3UuvHcbNin4Za3TvTU9CCk" />
<style>
/* Blog index: hide excerpt body, show only metadata */
.md-post--excerpt .md-post__content > h2 { display: block; }
.md-post--excerpt .md-post__content > p:nth-of-type(1) { display: block; }
.md-post--excerpt .md-post__content > *:not(h2):not(p:nth-of-type(1)):not(.md-post__action) { display: none; }
/* Header: Discord and LinkedIn paired with the GitHub source link */
.md-header__source { width: auto; max-width: none; display: flex; align-items: center; gap: .2rem; }
.md-header__discord { margin-left: .2rem; }
.md-header__discord svg { width: 1.35rem; height: 1.35rem; fill: currentcolor; display: block; }
.md-header__linkedin svg { width: 1.18rem; height: 1.35rem; fill: currentcolor; display: block; }
/* GitHub link: icon only — hide repository text and runtime-fetched stars/forks */
.md-source__repository { display: none; }
.md-source__facts { display: none; }
</style>
{% endblock %}

{{ super() }}
